name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build-time value only. Real deployments supply this from Vercel's
      # environment; no secret is required to verify the repository.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

      # T11/F6 — NOT A SECRET, and deliberately so.
      #
      # This is the local Supabase stack's published development service-role
      # key: a fixed JWT signed with the published local JWT secret
      # ("super-secret-jwt-token-with-at-least-32-characters-long"), printed by
      # `npx supabase status` on every developer's machine. It authenticates
      # nothing that exists outside a local `supabase start`.
      #
      # It is here so that the bundle scan's VALUE-level assertion actually
      # runs. Without a value in the environment the scan could only check
      # variable names, and it used to report a clean pass anyway — which is
      # finding F6. A real production key must never be placed here; it would
      # buy nothing and would put a live credential in a CI log's blast radius.
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # T10 — read the built output, not the source. The source scan in
      # `tests/unit/supabase/` proves nobody wrote a server variable in a client
      # file; only this proves what the compiler actually emitted, which is where
      # `NEXT_PUBLIC_*` inlining and stray server imports would show up.
      - name: Scan the client bundle for secrets
        run: npm run scan:bundle

  # ---------------------------------------------------------------------------
  # T09 — the database security gate.
  #
  # This job is a BLOCKER and may never be skipped (tests/README.md).
  #
  # It exists because of a finding T09 made about CI itself: before this, the
  # entire pgTAP suite ran only on a developer's machine. Every protection built
  # in T03–T08 — RLS, the grant matrix, the append-only ledger, the temporal
  # exclusion constraints, the seed's integrity — was verified nowhere that could
  # block a merge. A migration that dropped a policy passed CI green.
  #
  # Both suites run here, and they answer different questions:
  #   db:test          — the catalogue is correct (reached as owner, via SET ROLE)
  #   test:integration — a browser holding the anon key gets what we think it
  #                      gets (reached over HTTP, with real JWTs)
  # Neither substitutes for the other: SET ROLE is not a JWT, and a JWT cannot
  # see the catalogue.
  # ---------------------------------------------------------------------------
  database:
    name: database security · pgTAP + anon-key RLS suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pinned CLI from node_modules, never a global install — the local
      # stack must be the version package.json names.
      - name: Start local Supabase stack
        run: npx supabase start

      # From zero, every time: migrations in order, then the T08 seed. This is
      # also the reproducibility proof — if a migration only applies to a
      # database that already had the previous state, it fails here.
      - name: Reset database from zero (migrations + seed)
        run: npm run db:reset

      - name: Database tests (pgTAP)
        run: npm run db:test

      # T09's anon-key suite and T10's auth/session/account-deletion suite. The
      # latter starts the real application against this stack, so it needs the
      # seed above and must run after `db:test` (tests/integration/README.md).
      - name: Anon-key RLS, auth, session and account-deletion suites
        run: npm run test:integration

      - name: Stop stack
        if: always()
        run: npx supabase stop --no-backup
